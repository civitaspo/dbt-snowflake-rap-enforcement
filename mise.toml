[tools]
"aqua:astral-sh/uv" = "0.12.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = "1.0.0"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"aqua:suzuki-shunsuke/pinact" = "4.1.1"

[tasks.lint]
description = "Run local lint checks"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -d scripts ]; then
  find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
fi
if [ -d .github/workflows ]; then
  ghalint run
  pinact run --check
fi
"""

[tasks.test]
description = "Run package unit and integration tests"
run = """
#!/usr/bin/env bash
set -euo pipefail
uv sync --frozen
uv run dbt deps --project-dir unit_tests --profiles-dir unit_tests
uv run dbt run-operation run_unit_tests --project-dir unit_tests --profiles-dir unit_tests
uv run dbt deps --project-dir integration_tests --profiles-dir integration_tests
uv run python integration_tests/run_downstream_failure_tests.py
uv run dbt compile --project-dir integration_tests --profiles-dir integration_tests
"""

[tasks."test:snowflake-e2e"]
description = "Local-only Snowflake E2E (requires DBT_SNOWFLAKE_RAP_E2E_* env vars; not run in CI)"
run = """
#!/usr/bin/env bash
set -euo pipefail
uv sync --frozen --extra snowflake-e2e
uv run --extra snowflake-e2e python snowflake_e2e/run_e2e.py
"""
