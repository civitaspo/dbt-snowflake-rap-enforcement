name: wc-test

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.12"
          install_args: "--locked"
          cache: false

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install unit test packages
        run: uv run dbt deps --project-dir unit_tests --profiles-dir unit_tests

      - name: Run unit tests
        run: uv run dbt run-operation run_unit_tests --project-dir unit_tests --profiles-dir unit_tests

      - name: Install integration test packages
        run: uv run dbt deps --project-dir integration_tests --profiles-dir integration_tests

      - name: Run downstream failure tests
        run: uv run python integration_tests/run_downstream_failure_tests.py

      - name: Run downstream retry tests
        run: uv run python integration_tests/run_retry_tests.py

      - name: Compile integration project
        run: uv run dbt compile --project-dir integration_tests --profiles-dir integration_tests
