# Outermost PR entry: bind the pull_request event only.
# Event facts (e.g. title-only edit) are computed here and passed into workflow_call_pr.

name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/workflow_call_pr.yml
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}

  status-check:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    permissions: {}
    needs:
      - checks
    steps:
      - name: Require all PR checks to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
