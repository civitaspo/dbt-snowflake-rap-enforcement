name: dbt_snowflake_rap_enforcement_snowflake_e2e
version: 0.1.0
config-version: 2

profile: snowflake_e2e

# Apply only — downstream lint is covered by DuckDB integration tests.
on-run-end:
  - "{{ dbt_snowflake_rap_enforcement.apply_row_access_policies() }}"

vars:
  dbt_snowflake_rap_enforcement:
    apply_authoritatively: true
  # Overridden by run_e2e.py for each isolated run.
  e2e_policy_fqn: "REPLACE_ME.REPLACE_ME.REPLACE_ME"

models:
  dbt_snowflake_rap_enforcement_snowflake_e2e:
    +materialized: table
